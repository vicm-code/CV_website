<!DOCTYPE html>
<html lang="nl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projecten – Charlotte Vandeputte</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="../style.css">

    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="../favicon/favicon.ico">
    <link rel="icon" type="image/png" sizes="16x16" href="../favicon/favicon-16x16.png">
    <link rel="icon" type="image/png" sizes="32x32" href="../favicon/favicon-32x32.png">
    <link rel="apple-touch-icon" sizes="180x180" href="../favicon/apple-touch-icon.png">
    <link rel="manifest" href="../favicon/site.webmanifest">

    <!-- SEO -->
    <meta name="description"
        content="Creatieve projecten, boeken en muurschilderingen van illustrator Charlotte Vandeputte.">
    <link rel="canonical" href="https://charlottevandeputte.com/projecten/">
</head>

<body>

    <nav class="sidebar" aria-label="Hoofdnavigatie">
        <a href="../" class="logo-link">
            <img src="../images/menu/cvdp2.png" alt="Charlotte Vandeputte Logo" class="sidebar-logo">
        </a>

        <div class="mobile-name">Charlotte Vandeputte</div>
        <button class="menu-toggle" aria-label="Menu openen" aria-expanded="false">
            <span></span>
            <span></span>
        </button>

        <ul class="nav-links">
            <li><a href="../"><span>Portfolio</span></a></li>
            <li><a href="../schetsen/"><span>Schetsen</span></a></li>
            <li class="active"><a href="./"><span>Projecten</span></a></li>
            <li><a href="../over-mij/"><span>Over mij</span></a></li>
            <li><a href="../contact/"><span>Contact</span></a></li>
        </ul>

        <div class="social-links">
            <a href="mailto:vandeputtecharlotte@outlook.com" target="_blank" aria-label="E-mail sturen">
                <img src="../images/icons/mail.png" alt="Email icon">
            </a>
            <a href="https://www.linkedin.com/in/charlottevandeputte" target="_blank" rel="noopener"
                aria-label="LinkedIn Profiel">
                <img src="../images/icons/linkedin.png" alt="LinkedIn icon">
            </a>
            <a href="https://www.instagram.com/charlotteillustratie" target="_blank" rel="noopener"
                aria-label="Instagram Profiel">
                <img src="../images/icons/instagram.png" alt="Instagram icon">
            </a>
        </div>
    </nav>

    <div class="main-container">
        <main class="content">

            <div class="projects-grid">

                <!-- Schilderijen -->
                <div class="project-item">
                    <a href="schilderijen/" class="project-link">
                        <div class="project-image-wrapper">
                            <img src="schilderijen/images/preview.webp" alt="Schilderijen van Charlotte Vandeputte">
                        </div>
                        <h3>Schilderijen</h3>
                    </a>
                </div>

                <!-- Boeken -->
                <div class="project-item">
                    <a href="boeken/" class="project-link">
                        <div class="project-image-wrapper">
                            <img src="boeken/images/preview.webp" alt="Geïllustreerde boeken van Charlotte Vandeputte">
                        </div>
                        <h3>Boeken</h3>
                    </a>
                </div>

                <!-- Tour Elentrik -->
                <div class="project-item">
                    <a href="tour_elentrik/" class="project-link">
                        <div class="project-image-wrapper">
                            <img src="tour_elentrik/images/preview.webp" alt="Tour Elentrik straatkunst project">
                        </div>
                        <h3>Tour Elentrik</h3>
                    </a>
                </div>

                <!-- KULeuven muurschildering -->
                <div class="project-item">
                    <a href="kuleuven_muurschildering/" class="project-link">
                        <div class="project-image-wrapper">
                            <img src="kuleuven_muurschildering/images/preview.webp" alt="KU Leuven muurschildering">
                        </div>
                        <h3>KU Leuven Muurschildering</h3>
                    </a>
                </div>

            </div>

        </main>

        <footer class="site-footer">
            <p>&copy; <span id="year"></span> Charlotte Vandeputte</p>
        </footer>

    <script src="../script.js"></script>

</html>
